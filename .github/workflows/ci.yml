name: VectraBase AI — CI/CD Pipeline
# Author: Karthik Kathari (github.com/Karthik-Kathari)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '12'

jobs:
  typecheck-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm turbo run build --filter=@vectrabase/shared-types

      - name: Typecheck all packages
        run: pnpm turbo run typecheck

      - name: Lint all packages
        run: pnpm turbo run lint

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vectrabase
          POSTGRES_PASSWORD: vectrabase_secret
          POSTGRES_DB: vectrabase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm turbo run build --filter=@vectrabase/shared-types

      - name: Run migrations
        working-directory: apps/api-gateway
        env:
          DATABASE_URL: postgresql://vectrabase:vectrabase_secret@localhost:5432/vectrabase_test
        run: pnpm prisma migrate deploy

      - name: Run tests
        env:
          DATABASE_URL: postgresql://vectrabase:vectrabase_secret@localhost:5432/vectrabase_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_at_least_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_characters
          NODE_ENV: test
        run: pnpm turbo run test

  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        env:
          NEXT_PUBLIC_API_URL: https://vectrabase-api.onrender.com
          NEXT_PUBLIC_RAG_URL: https://vectrabase-rag.onrender.com
          NEXT_PUBLIC_WIDGET_URL: https://vectrabase-widget.vercel.app
        run: pnpm turbo run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/web-dashboard/.next/
            apps/embed-widget/dist/
            apps/api-gateway/dist/
          retention-days: 7

  python-tests:
    name: Python FastAPI Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vectrabase
          POSTGRES_PASSWORD: vectrabase_secret
          POSTGRES_DB: vectrabase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/rag-engine/requirements.txt

      - name: Install Python dependencies
        working-directory: apps/rag-engine
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run Python tests
        working-directory: apps/rag-engine
        env:
          DATABASE_URL: postgresql://vectrabase:vectrabase_secret@localhost:5432/vectrabase_test
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
        run: pytest tests/ -v --asyncio-mode=auto

