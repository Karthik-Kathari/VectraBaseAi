<!DOCTYPE html>
<html lang="en" style="height: 100%; margin: 0; padding: 0;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VectraBase AI Assistant Widget</title>
  <link rel="stylesheet" href="/widget.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }
    html.dark, body.dark {
      background: #090b10;
      color: #f8fafc;
    }
    #vectrabase-widget {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div id="vectrabase-widget"></div>
  <script>
    window.process = window.process || { env: { NODE_ENV: 'production' } };
    window.__VECTRABASE_API_URL__ = 'https://vectrabase-api.onrender.com';
  </script>
  <script src="/widget.js"></script>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var queryTheme = params.get('theme');
      var currentTheme = (queryTheme === 'light' || queryTheme === 'dark') ? queryTheme : 'dark';

      function applyTheme(theme) {
        currentTheme = theme;
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.body.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.body.classList.remove('dark');
        }
        var target = document.getElementById('vectrabase-widget');
        if (target) {
          if (theme === 'dark') {
            target.classList.add('dark');
            target.classList.remove('light');
          } else {
            target.classList.remove('dark');
            target.classList.add('light');
          }
          target.setAttribute('data-theme', theme);
        }
        if (window.VectraBaseWidget && typeof window.VectraBaseWidget.setTheme === 'function') {
          window.VectraBaseWidget.setTheme(theme);
        }
      }

      applyTheme(currentTheme);

      window.addEventListener('message', function(event) {
        if (event.data && (event.data.type === 'SET_THEME' || event.data.type === 'THEME_CHANGE')) {
          var requestedTheme = event.data.theme === 'light' ? 'light' : 'dark';
          applyTheme(requestedTheme);
        }
      });

      function start() {
        var w = window.VectraBaseWidget;
        if (!w) {
          console.warn("[VectraBase] Widget script not yet ready, retrying...");
          setTimeout(start, 50);
          return;
        }
        var initFn = typeof w.init === 'function' ? w.init : (w.default && typeof w.default.init === 'function' ? w.default.init : null);
        if (initFn) {
          var docId = params.get('docId') || (typeof localStorage !== 'undefined' ? localStorage.getItem('vectrabase_active_document_id') : null);
          var targetTenantId = params.get('tenantId') || (typeof localStorage !== 'undefined' ? localStorage.getItem('vectrabase_active_tenant_id') : null) || '00000000-0000-0000-0000-000000000001';
          initFn({
            tenantId: targetTenantId,
            documentId: docId || undefined,
            apiUrl: 'https://vectrabase-api.onrender.com',
            theme: currentTheme
          });
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
