# VectraBase AI — Render Blueprint Deployment Manifest
# Author: Karthik Kathari (github.com/Karthik-Kathari)

services:
  # Node.js API Gateway (Express + Prisma + Redis)
  - type: web
    name: vectrabase-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @vectrabase/shared-types build && cd apps/api-gateway && pnpm prisma generate && pnpm build
    startCommand: node apps/api-gateway/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://vectrabase-ai.vercel.app,http://localhost:3000,http://localhost:5173
      - key: RAG_ENGINE_URL
        value: https://vectrabase-rag.onrender.com

  # Python FastAPI RAG Engine (asyncpg + pgvector)
  - type: web
    name: vectrabase-rag
    runtime: python
    plan: free
    region: oregon
    rootDir: apps/rag-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"

